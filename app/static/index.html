<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lumina</title><link rel="stylesheet" href="/static/styles.css"></head>
<body><main><header><p class="eyebrow">AI RESEARCH ASSISTANT</p><h1>Lumina</h1><p>Bring a paper. Leave with clarity.</p></header>
<section class="card"><label for="content">Paper or research content</label><textarea id="content" minlength="100" placeholder="Paste your abstract, paper, or research content here…"></textarea><div class="actions"><button data-task="summary">Summarize</button><button data-task="insights">Key insights</button><button data-task="structured">Structured brief</button></div></section>
<section class="card"><label for="question">Ask about this paper</label><div class="ask"><input id="question" placeholder="What are the stated limitations?"><button id="ask">Ask</button></div></section>
<section class="card output"><div class="output-head"><h2>Response</h2><span id="status">Ready</span></div><pre id="result">Your research analysis will appear here.</pre></section>
</main><script src="/static/app.js"></script></body></html>
