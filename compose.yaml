services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [lumina]

  api:
    image: ${LUMINA_IMAGE:-lumina-api:local}
    build: .
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
      MAX_CONTENT_CHARS: ${MAX_CONTENT_CHARS:-50000}
      LOG_LEVEL: INFO
    expose: ["8000"]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [lumina]

  ollama:
    image: ollama/ollama:0.9.6
    volumes:
      - ollama-data:/root/.ollama
    expose: ["11434"]
    gpus: all
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks: [lumina]

  ollama-init:
    image: ollama/ollama:0.9.6
    environment:
      OLLAMA_HOST: ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:4b}
    depends_on:
      ollama:
        condition: service_healthy
    command: ["/bin/sh", "-c", "ollama pull $${OLLAMA_MODEL}"]
    restart: "no"
    networks: [lumina]

volumes:
  ollama-data:

networks:
  lumina:
    driver: bridge

