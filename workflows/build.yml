name: Build and publish Lumina API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  IMAGE_NAME: lumina

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to Azure Container Registry
        run: az acr login --name "${{ secrets.ACR_NAME }}"
      - name: Build and push
        env:
          REGISTRY: ${{ secrets.ACR_NAME }}.azurecr.io
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$IMAGE_NAME:$SHA" -t "$REGISTRY/$IMAGE_NAME:latest" .
          docker push "$REGISTRY/$IMAGE_NAME:$SHA"
          docker push "$REGISTRY/$IMAGE_NAME:latest"

