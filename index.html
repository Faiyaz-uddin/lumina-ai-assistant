<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina - Academic AI Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-override.css">
</head>

<body>

    <!-- Header -->
    <header class="app-header">
        <div class="logo">Lumina</div>
    </header>

    <!-- Main Container -->
    <main id="app-container">
        <!-- View: Landing -->
        <section id="view-landing" class="view active">
            <div class="landing-content">
                <h1>Lumina</h1>
                <p class="subtitle">
                    Your intelligent AI assistant for academic research and writing.
                </p>

                <div class="action-cards">
                    <button class="action-card" onclick="App.startMode('general')">
                        <div class="card-content">
                            <div class="card-title"> Ask Anything</div>
                            <div class="card-desc">General research questions and academic assistance</div>
                        </div>
                    </button>

                    <button class="action-card action-card-featured" onclick="App.openPaperForm()">
                        <div class="card-content">
                            <div class="card-title"> Help Me With My Paper</div>
                            <div class="card-desc">Personalized support for your research project</div>
                        </div>
                    </button>
                </div>
            </div>
        </section>

        <!-- View: Paper Details Form (Modal/Card) -->
        <div id="modal-paper-form" class="modal hidden">
            <div class="modal-backdrop" onclick="App.closePaperForm()"></div>
            <div class="modal-card">
                <h2>Paper Details</h2>
                <p class="modal-desc">Tell Lumina about your research to get tailored assistance.</p>

                <form id="paper-form" onsubmit="App.submitPaperForm(event)">
                    <div class="form-group">
                        <label>Paper Title</label>
                        <input type="text" name="title" required placeholder="e.g. Transformers in Vision">
                    </div>

                    <div class="form-group">
                        <label>Research Area</label>
                        <input type="text" name="area" required placeholder="e.g. Computer Vision, NLP">
                    </div>

                    <div class="form-group">
                        <label>Abstract</label>
                        <textarea name="abstract" rows="4" required
                            placeholder="Paste your abstract or summary..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Goal / Objective</label>
                        <select name="goal">
                            <option value="Writing Assistance">Writing Assistance</option>
                            <option value="Literature Review">Literature Review</option>
                            <option value="Methodology Refinement">Methodology Refinement</option>
                            <option value="Proofreading">Proofreading & Polishing</option>
                            <option value="Brainstorming">Brainstorming Ideas</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Special Instructions (Optional)</label>
                        <input type="text" name="special" placeholder="e.g. strict formal tone, focus on clarity">
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn btn-text" onclick="App.closePaperForm()">Cancel</button>
                        <button type="submit" class="btn btn-primary">Start Session</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- View: Chat Interface -->
        <section id="view-chat" class="view hidden">

            <!-- Sidebar / Top Bar for Paper Info (Visible only in Paper Mode) -->
            <aside id="paper-info-panel" class="hidden">
                <div class="panel-header">
                    <h3>Current Paper</h3>
                    <button class="icon-btn" onclick="App.togglePanelInfo()">✕</button>
                </div>
                <div class="panel-content" id="paper-details-display">
                    <!-- Populated via JS -->
                </div>
            </aside>

            <div class="chat-layout">
                <button class="floating-back-btn" onclick="App.goBack()">← Back</button>

                <div class="chat-header-bar">
                    <button class="btn-back" onclick="App.goBack()">← Back</button>
                    <span id="chat-mode-indicator">General Mode</span>
                    <button id="info-toggle-btn" class="icon-btn hidden" onclick="App.togglePanelInfo()">ℹ️</button>
                </div>

                <div class="chat-messages" id="chat-container">
                    <!-- Messages go here -->

                    <div class="message system-welcome">
                        <div class="bubble">
                            Hello! I am Lumina. How can I assist you today?
                        </div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <textarea id="user-input" rows="1" placeholder="Ask a question..."
                            onkeydown="App.handleInputKey(event)"></textarea>
                        <button class="btn-send" onclick="App.sendMessage()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>

</html>
